<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{LABEL}}</title>
<link rel="icon" href="/flicker/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #ffffff; --bg2: #f5f5f5; --fg: #1a1a1a; --fg-dim: #666666; --border: #d8d8d8;
    --accent: #6fa3ee; --err: #b3261e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--serif); font-size: 17px; line-height: 1.65; }
  header.masthead { font-family: var(--mono); background: var(--accent); color: var(--fg); padding: 14px 24px; font-size: 13px; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 56px 24px 80px; }
  form { font-family: var(--mono); font-size: 13px; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--bg2); padding: 22px 22px 24px; }
  label.f { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; margin: 0 0 6px; }
  label.f:not(:first-child) { margin-top: 18px; }
  input[type=text], input[type=password] { width: 100%; font-family: var(--mono); font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 0; padding: 10px 12px; -webkit-appearance: none; appearance: none; }
  input[type=text]:focus, input[type=password]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .pw { position: relative; }
  .pw input { padding-right: 60px; }
  .pw button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--fg-dim); font-family: var(--mono); font-size: 12px; padding: 8px; cursor: pointer; }
  .pw button:hover { color: var(--fg); text-decoration: underline; }
  .remember { display: flex; align-items: center; gap: 10px; margin: 20px 0 0; font-size: 13px; cursor: pointer; }
  .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  button.go { width: 100%; margin-top: 20px; font-family: var(--mono); font-size: 13px; background: var(--accent); color: var(--fg); border: 1px solid var(--accent); border-radius: 0; padding: 11px; cursor: pointer; }
  button.go:hover { filter: brightness(0.96); }
  button.go:disabled { opacity: .6; cursor: default; }
  #err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 14px; }
  #err:empty { margin-top: 0; min-height: 0; }
</style>
</head>
<body>
<header class="masthead"><span class="brand">{{LABEL}}</span></header>
<div class="wrap">
<form id="f" method="post" action="/_auth/login" data-next="{{NEXT}}">
  <label class="f" for="u">Username</label>
  <input id="u" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
  <label class="f" for="p">Password</label>
  <div class="pw">
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="button" id="show" aria-pressed="false">show</button>
  </div>
  <label class="remember"><input id="r" type="checkbox" checked><span>Remember this device</span></label>
  <button class="go" id="go" type="submit">Sign in</button>
  <div id="err" role="alert"></div>
</form>
</div>
<script>
(function () {
  var f = document.getElementById('f'), u = document.getElementById('u'), p = document.getElementById('p'),
      err = document.getElementById('err'), go = document.getElementById('go');
  var KEY = 'signin-user-{{REALM}}';
  try { var saved = localStorage.getItem(KEY); if (saved) { u.value = saved; p.focus(); } } catch (e) {}
  document.getElementById('show').onclick = function () {
    var on = p.type === 'password'; p.type = on ? 'text' : 'password';
    this.textContent = on ? 'hide' : 'show'; this.setAttribute('aria-pressed', on);
  };
  f.addEventListener('submit', function (e) {
    e.preventDefault(); err.textContent = ''; go.disabled = true;
    fetch('/_auth/login', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ realm: '{{REALM}}', username: u.value, password: p.value, remember: document.getElementById('r').checked, next: f.dataset.next })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (!x.ok) { err.textContent = x.j.error || 'Could not sign in'; go.disabled = false; p.select(); return; }
        try { localStorage.setItem(KEY, u.value); } catch (e) {}
        location.replace(x.j.next || '/');
      })
      .catch(function () { err.textContent = 'Network problem, try again'; go.disabled = false; });
  });
})();
</script>
</body>
</html>
