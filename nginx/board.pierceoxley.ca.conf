# Backend: board-backend running on 127.0.0.1:4033 (board-backend.service)
# Sign-in is handled by the app itself (name + shared password, signed cookie), so there is no Basic Auth here.
# Pages are public but empty: everything private comes from /api/, which refuses requests without a session.
# Keep this site on HTTPS only: passwords travel in the login request.

server {
    server_name board.pierceoxley.ca;

    root /var/www/board.pierceoxley.ca;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # backend/ holds users.json and the calendar links, so it must never be served
    location ^~ /backend/ {
        return 404;
    }

    # API proxy strips the /api prefix, so the pages call plain "api/calendar"
    location /api/ {
        proxy_pass http://127.0.0.1:4033/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # TLS block gets added by: sudo certbot --nginx -d board.pierceoxley.ca

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/board.pierceoxley.ca/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/board.pierceoxley.ca/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = board.pierceoxley.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name board.pierceoxley.ca;
    listen 80;
    return 404; # managed by Certbot


}