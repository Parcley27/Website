server {
    include snippets/site-auth.conf;
    server_name pierceoxley.ca www.pierceoxley.ca;
    root /var/www/pierceoxley.ca/main;
    index pierceoxley.html;

    location / {
        try_files $uri $uri/ =404;

    }

    location /das/ {
        index das.html;

    }

    location /flicker/ {
        index index.html;
    }

    location /explore/ {
        index index.html;
    }

    # icons are public so the tab icon loads on password-protected pages too
    location ~ ^/(notes|archive|trading|ig)/(favicon\.svg|favicon\.ico|favicon-32x32\.png|apple-touch-icon\.png)$ {
        auth_request off;
    }

    location /archive/ {
        set $auth_realm archive;
        auth_request /_auth_check_archive;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @site_login;
        index index.html;
        try_files $uri $uri/ /archive/index.html;
    }

    location /archive-api/ {
        set $auth_realm archive;
        auth_request /_auth_check_archive;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_pass http://127.0.0.1:4029/;
        proxy_http_version 1.1;
        proxy_set_header X-Remote-User $auth_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    location /ig/ {
        set $auth_realm ig;
        auth_request /_auth_check_ig;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @site_login;
        index index.html;
        try_files $uri $uri/ /ig/index.html;
    }

    location /ig-api/ {
        set $auth_realm ig;
        auth_request /_auth_check_ig;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_pass http://127.0.0.1:4031/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /trading/ {
        set $auth_realm ig;
        auth_request /_auth_check_ig;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @site_login;
        index index.html;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /trading/index.html;
    }

    location /notes/ {
        set $auth_realm notes;
        auth_request /_auth_check_notes;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @site_login;
        index index.html;
        try_files $uri $uri/ /notes/index.html;
    }

    location /notes-api/ {
        set $auth_realm notes;
        auth_request /_auth_check_notes;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_pass http://127.0.0.1:4032/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 200m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pierceoxley.ca/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pierceoxley.ca/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.pierceoxley.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = pierceoxley.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name pierceoxley.ca www.pierceoxley.ca;
    return 404; # managed by Certbot




}
