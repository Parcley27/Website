server {
    server_name pierceoxley.ca www.pierceoxley.ca;
    root /var/www/pierceoxley.ca/main;
    index pierceoxley.html;

    location / {
        try_files $uri $uri/ =404;

    }

    location /das/ {
        index das.html;

    }

    location /flicker/ {
        index index.html;
    }

    location /archive/ {
        auth_basic "Family Archive";
        auth_basic_user_file /etc/nginx/.htpasswd-archive;
        index index.html;
        try_files $uri $uri/ /archive/index.html;
    }

    location /archive-api/ {
        auth_basic "Family Archive";
        auth_basic_user_file /etc/nginx/.htpasswd-archive;
        proxy_pass http://127.0.0.1:4029/;
        proxy_http_version 1.1;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    location /ig/ {
        auth_basic "IG Tracker";
        auth_basic_user_file /etc/nginx/.htpasswd-ig;
        index index.html;
        try_files $uri $uri/ /ig/index.html;
    }

    location /ig-api/ {
        auth_basic "IG Tracker";
        auth_basic_user_file /etc/nginx/.htpasswd-ig;
        proxy_pass http://127.0.0.1:4031/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /notes/ {
        auth_basic "Notes";
        auth_basic_user_file /etc/nginx/.htpasswd-notes;
        index index.html;
        try_files $uri $uri/ /notes/index.html;
    }

    location /notes-api/ {
        auth_basic "Notes";
        auth_basic_user_file /etc/nginx/.htpasswd-notes;
        proxy_pass http://127.0.0.1:4032/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 200m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pierceoxley.ca/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pierceoxley.ca/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.pierceoxley.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = pierceoxley.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name pierceoxley.ca www.pierceoxley.ca;
    return 404; # managed by Certbot




}
