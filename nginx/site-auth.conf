# Shared sign-in endpoints, included inside every server block that uses auth_request.
# Backend: site-auth-gateway.service on 127.0.0.1:4034 (see auth-backend/server.js).
# Protect a location with:
#     set $auth_realm archive;                        # archive | ig | notes | terminal
#     auth_request /_auth_check_archive;              # same realm name as above
#     auth_request_set $auth_user $upstream_http_x_auth_user;
#     error_page 401 = @site_login;                   # pages only; API locations just return 401

location ^~ /_auth/ {
    auth_request off;
    proxy_pass http://127.0.0.1:4034/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /_auth_check_archive {
    internal;
    proxy_pass http://127.0.0.1:4034/check;
    proxy_set_header X-Auth-Realm archive;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /_auth_check_ig {
    internal;
    proxy_pass http://127.0.0.1:4034/check;
    proxy_set_header X-Auth-Realm ig;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /_auth_check_notes {
    internal;
    proxy_pass http://127.0.0.1:4034/check;
    proxy_set_header X-Auth-Realm notes;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /_auth_check_terminal {
    internal;
    proxy_pass http://127.0.0.1:4034/check;
    proxy_set_header X-Auth-Realm terminal;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location @site_login {
    return 302 /_auth/login?realm=$auth_realm&next=$request_uri;
}
