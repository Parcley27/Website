server {
    server_name beta.pierceoxley.ca;
    root /var/www/beta.pierceoxley.ca/main;
    index pierceoxley.html;

    location / {
        try_files $uri $uri/ =404;
    }
    
    location /das/ {
        index das.html;
    }

    location /notes/ {
        auth_basic "Notes";
        auth_basic_user_file /etc/nginx/.htpasswd-notes;
        index index.html;
        try_files $uri $uri/ /notes/index.html;
    }

    location /notes-api/ {
        auth_basic "Notes";
        auth_basic_user_file /etc/nginx/.htpasswd-notes;
        proxy_pass http://127.0.0.1:4032/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 200m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/beta.pierceoxley.ca/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/beta.pierceoxley.ca/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = beta.pierceoxley.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name beta.pierceoxley.ca;
    return 404; # managed by Certbot


}
